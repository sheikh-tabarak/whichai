<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="100%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Part -->
  <rect x="10" y="10" width="40" height="40" rx="12" fill="url(#brandGradient)" fill-opacity="0.15" stroke="url(#brandGradient)" stroke-width="2" />
  <path d="M24 24L36 36M36 24L24 36" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="20" cy="20" r="1.5" fill="white" />
  <circle cx="40" cy="20" r="1.5" fill="white" />
  <circle cx="20" cy="40" r="1.5" fill="white" />
  <circle cx="40" cy="40" r="1.5" fill="white" />

  <!-- Text Part -->
  <text x="65" y="42" fill="white" style="font: 900 32px system-ui, sans-serif; letter-spacing: -0.05em;">WHICH<tspan fill="url(#brandGradient)">AI</tspan></text>
</svg>
